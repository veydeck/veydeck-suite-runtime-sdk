[project]
name = "veydeck-suite-runtime-sdk"
version = "0.1.0-alpha.1"
description = "Veydeck trusted suite backend runtime SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veydeck_suite_runtime"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["veydeck_suite_runtime"]
