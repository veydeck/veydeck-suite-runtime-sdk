name: Publish to crates.io

run-name: "Rust SDK ${{ inputs.version }} to crates.io"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a tag prefix, for example 0.1.0-alpha.1
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: "runtime-sdk-crates-io-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Releases must be published from main, got: $RELEASE_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            exit 1
          fi

          MANIFEST="packages/rust/Cargo.toml"
          TAG="rust-$RELEASE_VERSION"
          RELEASE_NAME="Rust SDK $RELEASE_VERSION"

          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$MANIFEST" | head -n 1)"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch: input=$RELEASE_VERSION, $MANIFEST=$PACKAGE_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify crates.io credentials
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Configure the CARGO_REGISTRY_TOKEN secret before publishing to crates.io"
            exit 1
          fi

      - name: Validate Rust SDK
        run: |
          cargo fmt --all -- --check
          cargo clippy -p veydeck-suite-runtime-sdk --all-targets --all-features -- -D warnings
          cargo test -p veydeck-suite-runtime-sdk --all-targets
          cargo package -p veydeck-suite-runtime-sdk
          PACKAGE_PATH="$(find target/package -maxdepth 1 -type f -name 'veydeck-suite-runtime-sdk-*.crate' -print -quit)"
          PACKAGE_DIR="$(mktemp -d)"
          tar -xzf "$PACKAGE_PATH" -C "$PACKAGE_DIR"
          PACKAGE_MANIFEST="$(find "$PACKAGE_DIR" -mindepth 2 -maxdepth 2 -name Cargo.toml -print -quit)"
          cargo test --manifest-path "$PACKAGE_MANIFEST" --all-targets

      - name: Publish Rust SDK to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p veydeck-suite-runtime-sdk --locked --registry crates-io

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SDK: rust
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          printf -v RELEASE_NOTES 'Veydeck %s Runtime SDK 发布。\n\n包版本：`%s`\n\n提交：`%s`' \
            "$RELEASE_SDK" "$RELEASE_VERSION" "$GITHUB_SHA"
          RELEASE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES" \
            "${RELEASE_FLAGS[@]}"
