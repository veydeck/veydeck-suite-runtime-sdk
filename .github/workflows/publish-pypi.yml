name: Publish to PyPI

run-name: "Python SDK ${{ inputs.version }} to PyPI"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a tag prefix, for example 0.1.0-alpha.1
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

concurrency:
  group: "runtime-sdk-pypi-${{ inputs.version }}"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "Releases must be published from main, got: $RELEASE_REF"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            exit 1
          fi

          MANIFEST="packages/python/pyproject.toml"
          TAG="python-$RELEASE_VERSION"
          RELEASE_NAME="Python SDK $RELEASE_VERSION"

          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$MANIFEST" | head -n 1)"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Version mismatch: input=$RELEASE_VERSION, $MANIFEST=$PACKAGE_VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate Python SDK
        shell: bash
        run: |
          uv sync --project packages/python --all-groups --frozen
          uv run --project packages/python ruff format --check packages/python
          uv run --project packages/python ruff check packages/python
          uv run --project packages/python mypy packages/python/src packages/python/tests
          uv run --project packages/python pytest packages/python
          uv build --project packages/python --out-dir dist/python

      - name: Publish Python SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SDK: python
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          printf -v RELEASE_NOTES 'Veydeck %s Runtime SDK 发布。\n\n包版本：`%s`\n\n提交：`%s`' \
            "$RELEASE_SDK" "$RELEASE_VERSION" "$GITHUB_SHA"
          RELEASE_FLAGS=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_NOTES" \
            "${RELEASE_FLAGS[@]}"
