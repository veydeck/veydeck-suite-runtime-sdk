name: Check

run-name: "Check · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project packages/python --all-groups
      - run: uv run --project packages/python ruff check packages/python
      - run: uv run --project packages/python mypy packages/python/src
      - run: uv run --project packages/python pytest packages/python
